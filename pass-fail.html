<!DOCTYPE html>
<html>
	<head>
		<title>
			Creating a pass fail task
		</title>
		
		<style>
			input{
				height:50px;
				width :200px;
				border : 2px solid black;
				font-size:20px;
				
			}
			
			button{
				height:50px;
				width :100px;
				margin-left:20px;
				border : 2px solid black;
				font-size:20px;
			}
		</style>
	</head>
	
	
	<body>
		<input type="text" id="marks" placeholder="Enter a marks" >
		<button type="button" onclick="check()">check</button>
		
		<p id="result">  </p>
		<script>
			
			function check(){
			
				let marks = Number(document.getElementById('marks').value);
				
				//if(typeof marks === String){
				//	document.write('Text is not allowed -> use numbers only ');
				//}
			
				switch(true){
				
					case(marks >= 90 && marks == 100):
					document.getElementById('result').innerHTML = "Outstanding you are pass with Grade A";
					break;
				
					case(marks >= 75 && marks <= 90):
					document.getElementById('result').innerHTML = "Excellent you are pass with Grade B";
					break;
				
					case(marks >= 50 && marks <= 75):
					document.getElementById('result').innerHTML = "Good you are pss with Grade C";
					break;
				
					case(marks >= 35 && marks <= 50):
					document.getElementById('result').innerHTML = "Fair you are pass with Grade D";
					break; 
					
					case(marks < 0):
					document.getElementById('result').innerHTML = "Invalid Number";
					break;
					
					case(marks > 100):
					document.getElementById('result').innerHTML = "Use Numbers between 0 to 100";
					break;
					
					case(isNaN(marks)):
					document.getElementById('result').innerHTML = "Text is not allowed -> use numbers only ";
					break;
					
					default:
					document.getElementById('result').innerHTML = " Sorry you are Fail";
					
				}
			}
			
		</script>
	</body>
</html>

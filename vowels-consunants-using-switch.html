<!DOCTYPE html>
<html>
	<head>
		<title>
			Volwels and consunants using Switch case
		</title>
		
		<style>
			input{
				height:50px;
				width :200px;
				border : 2px solid black;
				font-size:20px;
				
			}
			
			button{
				height:50px;
				width :100px;
				margin-left:20px;
				border : 2px solid black;
				font-size:20px;
			}
		
		</style>
	</head>
	
	<body>
		<input type="text" id="ch" placeholder="Type Something">
		<button type="button" onclick="Vowels()"> click </button>
		
		<p id="result">  </p>
		<script>
		
			function Vowels(){
			
				let ch = document.getElementById('ch').value.toLowerCase();
				let vowels = 0;
				let consunants = 0 ;
				
				for(let i = 0 ; i < ch.length ; i++){
					
					switch(true){
					
						case('aeiou'.includes(ch[i])):
						vowels++;
						break;
					
						case('bcdfghjklmnpqrstvwxyz'.includes(ch[i])):
						consunants++;
						break;
					}
				}
				
				switch(true){
				
					case(vowels == 0 && consunants == 0):
					document.getElementById('result').innerHTML = 'not a vowel and not a consunants';
					break;
					
					default:
						document.getElementById('result').innerHTML = "Vowels: " + vowels +
						"<br>Consunants: " + consunants;
					
				}
				
			}
	
		</script>
	</body>
</html>
